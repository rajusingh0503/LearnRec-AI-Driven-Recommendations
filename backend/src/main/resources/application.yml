spring:
  application:
    name: learnrec-backend
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /

# App specific configurations
app:
  jwt:
    # Production secret injected via environment variable JWT_SECRET
    secret: ${JWT_SECRET}
    # Access token lifespan: 1 hour (3600000 ms)
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
    # Refresh token lifespan: 7 days (604800000 ms)
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    internal-key: ${AI_INTERNAL_KEY}
    timeout-ms: 5000
